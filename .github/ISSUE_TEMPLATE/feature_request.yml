name: Feature request
description: Define a user problem and clear acceptance criteria.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: "This issue is public. Use fictional examples; do not include private records or account information."
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who needs this and what task is difficult today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior and scope
      description: Explain the result users should see and any explicit exclusions.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes, including relevant error/cancel/empty states.
    validations:
      required: true
  - type: textarea
    id: upgrade
    attributes:
      label: Existing-user and UI/UX impact
      description: Mention storage, sync, backup, privacy, accessibility, or changed journeys if relevant; unknown is acceptable at planning time.
